[project]
name = "vegas-director-mcp"
version = "0.1.0"
description = "MCP server for driving MAGIX VEGAS Pro via its scripting API."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vegas_director_mcp*"]
