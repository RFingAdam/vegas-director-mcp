[project]
name = "cutrelay-mcp"
version = "0.3.0"
description = "CutRelay MCP: editor-agnostic AI video editing over MCP (FFmpeg-first; VEGAS Pro, DaVinci Resolve, OTIO/FCPXML/MLT backends)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0",
]

[project.scripts]
cutrelay-mcp = "cutrelay:main"
# Deprecated aliases, kept for one release.
nle-mcp = "cutrelay:main"
vegas-director-mcp = "cutrelay:main"

[project.optional-dependencies]
windows = ["pywin32>=306"]
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cutrelay*", "nle_mcp*", "vegas_director_mcp*"]
