[project]
name = "nle-mcp"
version = "0.2.0"
description = "Editor-agnostic MCP bridge for AI-driven video editing (FFmpeg, VEGAS Pro, DaVinci Resolve)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0",
]

[project.scripts]
nle-mcp = "nle_mcp:main"
vegas-director-mcp = "nle_mcp:main"

[project.optional-dependencies]
windows = ["pywin32>=306"]
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nle_mcp*", "vegas_director_mcp*"]
