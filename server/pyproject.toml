[project]
name = "takerelay-mcp"
version = "0.4.0"
description = "TakeRelay MCP: editor-agnostic AI video editing over MCP (FFmpeg-first; VEGAS Pro, DaVinci Resolve, OTIO/FCPXML/MLT backends)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0",
    # analyze_audio uses audioop, which left the stdlib in Python 3.13.
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/RFingAdam/takerelay"
Repository = "https://github.com/RFingAdam/takerelay"
Issues = "https://github.com/RFingAdam/takerelay/issues"
Documentation = "https://github.com/RFingAdam/takerelay#readme"

[project.scripts]
takerelay-mcp = "takerelay:main"
# Deprecated aliases, kept for one release.
cutrelay-mcp = "takerelay:main"
nle-mcp = "takerelay:main"
vegas-director-mcp = "takerelay:main"

[project.optional-dependencies]
windows = ["pywin32>=306"]
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["takerelay*", "cutrelay*", "nle_mcp*", "vegas_director_mcp*"]
